  <text x="700" y="520" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="44" font-style="italic" fill="#fff" text-anchor="middle">Đây là đoạn giới thiệu sách giữ chỗ. Khi</text><text x="700" y="588" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="44" font-style="italic" fill="#fff" text-anchor="middle">có thiết kế bìa thật, toàn bộ ảnh này sẽ</text><text x="700" y="656" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="44" font-style="italic" fill="#fff" text-anchor="middle">được thay bằng bìa sau của cuốn sách.</text><text x="700" y="850" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="44" font-style="italic" fill="#fff" text-anchor="middle">Một câu chuyện cảm động về lòng nhân</text><text x="700" y="918" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="44" font-style="italic" fill="#fff" text-anchor="middle">hậu, ký ức và sự tha thứ — được kể bằng</text><text x="700" y="986" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="44" font-style="italic" fill="#fff" text-anchor="middle">giọng văn giản dị mà sâu lắng.</text>
