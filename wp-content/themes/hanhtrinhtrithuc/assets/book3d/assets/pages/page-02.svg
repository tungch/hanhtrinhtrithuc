<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2050" viewBox="0 0 1400 2050">
<defs>
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
    <feBlend in2="SourceGraphic" mode="multiply"/>
  </filter></defs>

  <rect width="100%" height="100%" fill="#fbf9f3" filter="url(#g)"/>
  <text x="170" y="1480" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="30" fill="#2b2a28">Tên sách gốc: ORIGINAL TITLE</text>
<text x="170" y="1542.5" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="30" fill="#2b2a28">Bản quyền tiếng Việt © Nhà xuất bản. Mọi hình thức sao chép, trích dẫn</text>
<text x="170" y="1592.5" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="30" fill="#2b2a28">hay phát hành không có sự đồng ý của đơn vị giữ bản quyền đều là vi</text>
<text x="170" y="1642.5" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="30" fill="#2b2a28">phạm pháp luật.</text>
<text x="170" y="1705" font-family="Georgia, 'Times New Roman', 'Noto Serif', serif" font-size="30" fill="#2b2a28">Đây là trang thông tin giữ chỗ.</text>
  <text x="90" y="90" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="3" fill="#999" opacity="0.75" text-anchor="start">TRANG TẠM · 2</text>

